<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Health Profile — VitalNet</title>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600;700&family=IBM+Plex+Mono:wght@500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
<link rel="stylesheet" href="css/style.css">
</head>
<body data-page="health-profile.html" data-role="member" data-title="Health Profile" data-sub="Personal and medical information used across VitalNet">

<div class="grid" style="grid-template-columns:1fr 2fr;align-items:start;">
  <div class="card card-lg" style="text-align:center;">
    <div class="avatar" style="width:72px;height:72px;font-size:1.4rem;margin:0 auto 1rem;">YS</div>
    <h3 class="mb-0">Yagavi S</h3>
    <p class="text-muted" style="font-size:.85rem;">Community Member · Meenam Rasi</p>
    <div class="badge badge-ok" style="margin-top:.5rem;">Profile 90% complete</div>
    <div class="progress" style="margin-top:.8rem;"><div class="progress-bar" style="width:90%;"></div></div>
  </div>

  <form class="card card-lg" data-demo="Health profile updated.">
    <div class="card-head"><h3>Personal Details</h3></div>
    <div class="form-row">
      <div class="form-group"><label>Full Name</label><input class="form-control" value="Yagavi S"></div>
      <div class="form-group"><label>Date of Birth</label><input type="date" class="form-control" value="2004-03-15"></div>
    </div>
    <div class="form-row">
      <div class="form-group"><label>Gender</label><select class="form-control"><option>Female</option><option>Male</option><option>Other</option></select></div>
      <div class="form-group"><label>Blood Group</label><select class="form-control"><option>O+</option><option>A+</option><option>B+</option><option>AB+</option><option>O-</option></select></div>
    </div>
    <div class="form-row">
      <div class="form-group"><label>Height (cm)</label><input type="number" class="form-control" value="162"></div>
      <div class="form-group"><label>Weight (kg)</label><input type="number" class="form-control" value="58"></div>
    </div>
    <div class="form-group"><label>Medical History</label><textarea class="form-control" rows="3" placeholder="Allergies, chronic conditions, past surgeries...">No known allergies. Mild seasonal asthma.</textarea></div>
    <div class="form-row">
      <div class="form-group"><label>Emergency Contact Name</label><input class="form-control" placeholder="Contact name"></div>
      <div class="form-group"><label>Emergency Contact Number</label><input class="form-control" placeholder="+91"></div>
    </div>
    <button class="btn btn-primary">Save Changes</button>
  </form>
</div>

<script src="js/layout.js"></script>
<script src="js/app.js"></script>
</body>
</html>
