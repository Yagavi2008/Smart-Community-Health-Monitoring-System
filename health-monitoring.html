<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Health Monitoring — VitalNet</title>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600;700&family=IBM+Plex+Mono:wght@500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
<link rel="stylesheet" href="css/style.css">
</head>
<body data-page="health-monitoring.html" data-role="member" data-title="Health Monitoring" data-sub="Log and track your vital signs">

<div class="grid grid-2" style="margin-bottom:1rem;">
  <form class="card card-lg" data-demo="Vitals recorded successfully.">
    <div class="card-head"><h3>Log New Reading</h3><i class="fa-solid fa-plus" style="color:var(--primary);"></i></div>
    <div class="form-row">
      <div class="form-group"><label>Heart Rate (bpm)</label><input type="number" class="form-control" placeholder="76"></div>
      <div class="form-group"><label>SpO₂ (%)</label><input type="number" class="form-control" placeholder="97"></div>
    </div>
    <div class="form-row">
      <div class="form-group"><label>Blood Pressure (mmHg)</label><input class="form-control" placeholder="122/80"></div>
      <div class="form-group"><label>Blood Sugar (mg/dL)</label><input type="number" class="form-control" placeholder="95"></div>
    </div>
    <div class="form-row">
      <div class="form-group"><label>Body Temperature (°F)</label><input type="number" step="0.1" class="form-control" placeholder="98.6"></div>
      <div class="form-group"><label>BMI</label><input type="number" step="0.1" class="form-control" placeholder="22.4"></div>
    </div>
    <button class="btn btn-primary btn-block">Save Reading</button>
  </form>

  <div class="card card-lg">
    <div class="card-head"><h3>Current Status</h3></div>
    <div class="list-row"><span><i class="fa-solid fa-heart-pulse" style="color:var(--primary);"></i> Heart Rate</span><span class="badge badge-ok">76 bpm — Normal</span></div>
    <div class="list-row"><span><i class="fa-solid fa-lungs" style="color:var(--teal);"></i> SpO₂</span><span class="badge badge-ok">97% — Normal</span></div>
    <div class="list-row"><span><i class="fa-solid fa-droplet" style="color:var(--warn);"></i> Blood Pressure</span><span class="badge badge-warn">122/80 — Watch</span></div>
    <div class="list-row"><span><i class="fa-solid fa-cube" style="color:var(--alert);"></i> Blood Sugar</span><span class="badge badge-ok">95 mg/dL — Normal</span></div>
    <div class="list-row"><span><i class="fa-solid fa-thermometer-half" style="color:var(--ink-muted);"></i> Temperature</span><span class="badge badge-ok">98.4°F — Normal</span></div>
    <div class="list-row"><span><i class="fa-solid fa-weight-scale" style="color:var(--ok);"></i> BMI</span><span class="badge badge-ok">22.4 — Healthy</span></div>
  </div>
</div>

<div class="card card-lg">
  <div class="card-head"><h3>30-Day Vitals History</h3></div>
  <div style="height:260px;"><canvas id="vitalsChart"></canvas></div>
</div>

<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>
<script src="js/charts.js"></script>
<script src="js/layout.js"></script>
<script src="js/app.js"></script>
<script>
vnLineChart(document.getElementById('vitalsChart'),
  Array.from({length:10},(_,i)=>'Day '+(i*3+1)),
  [
    {label:'Systolic BP', data:[118,120,122,121,124,122,126,123,121,122], borderColor:VN_COLORS.primary, backgroundColor:'rgba(11,79,140,.06)'},
    {label:'Blood Sugar', data:[92,95,98,94,97,96,99,95,93,95], borderColor:VN_COLORS.warn, backgroundColor:'rgba(227,160,8,.06)'}
  ]);
</script>
</body>
</html>
