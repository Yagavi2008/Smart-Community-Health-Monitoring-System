<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Register — VitalNet</title>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600;700&family=IBM+Plex+Mono:wght@500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<div class="auth-wrap">
  <div class="auth-visual">
    <div class="brand-mark" style="color:#fff;"><span class="pulse-dot"></span> VitalNet</div>
    <div>
      <h2 style="color:#fff;max-width:18ch;">Two minutes to set up your health profile.</h2>
      <p style="color:#DCEBFA;max-width:34ch;margin-top:1rem;">Your profile powers personalised risk prediction, medicine reminders, and emergency alerts for you and your family.</p>
    </div>
    <div style="color:#7FA6C8;font-size:.8rem;">SIH 2025 · Smart Community Health Monitoring System</div>
  </div>
  <div class="auth-form-col">
    <div class="auth-box">
      <h2>Create your account</h2>
      <p class="text-muted" style="margin-bottom:1.5rem;">Already have an account? <a href="login.html">Log in</a></p>
      <form data-demo="Account created — welcome to VitalNet." data-redirect="dashboard.html">
        <div class="form-row">
          <div class="form-group"><label>Full Name</label><input class="form-control" placeholder="Your name" required></div>
          <div class="form-group"><label>Role</label>
            <select class="form-control">
              <option>Community Member</option><option>Doctor</option><option>Health Admin</option>
            </select>
          </div>
        </div>
        <div class="form-group"><label>Email</label><input type="email" class="form-control" placeholder="you@example.com" required></div>
        <div class="form-row">
          <div class="form-group"><label>Password</label><input type="password" class="form-control" required></div>
          <div class="form-group"><label>Confirm Password</label><input type="password" class="form-control" required></div>
        </div>
        <button class="btn btn-primary btn-block">Create Account</button>
      </form>
      <p class="text-muted" style="text-align:center;margin-top:1.2rem;font-size:.8rem;"><a href="index.html">← Back to home</a></p>
    </div>
  </div>
</div>
<script src="js/app.js"></script>
</body>
</html>
