<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>System Settings — VitalNet</title>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600;700&family=IBM+Plex+Mono:wght@500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
<link rel="stylesheet" href="css/style.css">
</head>
<body data-page="admin-settings.html" data-role="admin" data-title="System Settings" data-sub="Platform-wide configuration">

<div class="grid grid-2">
  <form class="card card-lg" data-demo="System settings saved.">
    <div class="card-head"><h3>General</h3></div>
    <div class="form-group"><label>Platform Name</label><input class="form-control" value="VitalNet"></div>
    <div class="form-group"><label>Support Email</label><input class="form-control" value="support@vitalnet.app"></div>
    <div class="form-group"><label>Emergency Alert Threshold — SpO₂ below</label><input type="number" class="form-control" value="92"></div>
    <div class="form-group"><label>Emergency Alert Threshold — BP above</label><input class="form-control" value="140/90"></div>
    <button class="btn btn-primary">Save Settings</button>
  </form>

  <div class="card card-lg">
    <div class="card-head"><h3>Access &amp; Roles</h3></div>
    <div class="list-row"><span>Allow self-registration for Community Members</span><input type="checkbox" checked></div>
    <div class="list-row"><span>Require admin approval for new Doctors</span><input type="checkbox" checked></div>
    <div class="list-row"><span>Two-factor authentication required</span><input type="checkbox"></div>
    <div class="list-row"><span>Auto-archive resolved emergency alerts (30 days)</span><input type="checkbox" checked></div>
  </div>
</div>

<script src="js/layout.js"></script>
<script src="js/app.js"></script>
</body>
</html>
