<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Appointments — VitalNet</title>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600;700&family=IBM+Plex+Mono:wght@500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
<link rel="stylesheet" href="css/style.css">
</head>
<body data-page="appointments.html" data-role="member" data-title="Appointments" data-sub="Book and manage your doctor visits">

<div class="grid" style="grid-template-columns:1fr 1.4fr;">
  <form class="card card-lg" data-demo="Appointment requested — you'll get a confirmation shortly.">
    <div class="card-head"><h3>Book an Appointment</h3></div>
    <div class="form-group"><label>Doctor</label>
      <select class="form-control">
        <option>Dr. R. Meena — Cardiology</option>
        <option>Dr. K. Suresh — General Physician</option>
        <option>Dr. A. Priya — Pediatrics</option>
      </select>
    </div>
    <div class="form-row">
      <div class="form-group"><label>Date</label><input type="date" class="form-control"></div>
      <div class="form-group"><label>Time</label><input type="time" class="form-control"></div>
    </div>
    <div class="form-group"><label>Reason for Visit</label><textarea class="form-control" rows="3" placeholder="Briefly describe your concern"></textarea></div>
    <button class="btn btn-primary btn-block">Request Appointment</button>
  </form>

  <div class="card card-lg">
    <div class="card-head"><h3>Your Appointments</h3></div>
    <table class="table">
      <thead><tr><th>Doctor</th><th>Date</th><th>Status</th><th></th></tr></thead>
      <tbody>
        <tr><td>Dr. R. Meena — Cardiology</td><td>Tue, 8 Jul · 10:30 AM</td><td><span class="badge badge-info">Confirmed</span></td><td><button class="btn btn-outline btn-sm" onclick="vnToast('Appointment cancelled.')">Cancel</button></td></tr>
        <tr><td>Dr. K. Suresh — General</td><td>Fri, 11 Jul · 4:00 PM</td><td><span class="badge badge-warn">Pending</span></td><td><button class="btn btn-outline btn-sm" onclick="vnToast('Appointment cancelled.')">Cancel</button></td></tr>
        <tr><td>Dr. A. Priya — Pediatrics</td><td>28 Jun · 9:00 AM</td><td><span class="badge badge-ok">Completed</span></td><td><button class="btn btn-outline btn-sm" onclick="vnToast('Opening visit summary...')">Summary</button></td></tr>
      </tbody>
    </table>
  </div>
</div>

<script src="js/layout.js"></script>
<script src="js/app.js"></script>
</body>
</html>
