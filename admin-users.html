<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>User Management — VitalNet</title>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600;700&family=IBM+Plex+Mono:wght@500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
<link rel="stylesheet" href="css/style.css">
</head>
<body data-page="admin-users.html" data-role="admin" data-title="User Management" data-sub="All registered community members">

<div class="card card-lg" style="margin-bottom:1rem;">
  <div class="flex-between">
    <input class="form-control" style="max-width:320px;" placeholder="Search by name or email...">
    <button class="btn btn-primary btn-sm" onclick="vnToast('New user invited.')"><i class="fa-solid fa-user-plus"></i> Invite User</button>
  </div>
</div>

<div class="card card-lg">
  <table class="table">
    <thead><tr><th>Name</th><th>Email</th><th>Role</th><th>Joined</th><th>Status</th><th></th></tr></thead>
    <tbody>
      <tr><td>Yagavi S</td><td>yagavi@example.com</td><td>Community Member</td><td>Mar 2025</td><td><span class="badge badge-ok">Active</span></td><td><button class="btn btn-outline btn-sm" onclick="vnToast('Opening user profile...')">View</button></td></tr>
      <tr><td>Karthik R</td><td>karthik@example.com</td><td>Community Member</td><td>Jan 2025</td><td><span class="badge badge-ok">Active</span></td><td><button class="btn btn-outline btn-sm" onclick="vnToast('Opening user profile...')">View</button></td></tr>
      <tr><td>Divya M</td><td>divya@example.com</td><td>Community Member</td><td>Nov 2024</td><td><span class="badge badge-ok">Active</span></td><td><button class="btn btn-outline btn-sm" onclick="vnToast('Opening user profile...')">View</button></td></tr>
      <tr><td>Ramesh K</td><td>ramesh@example.com</td><td>Community Member</td><td>Feb 2025</td><td><span class="badge badge-warn">Suspended</span></td><td><button class="btn btn-outline btn-sm" onclick="vnToast('Opening user profile...')">View</button></td></tr>
    </tbody>
  </table>
</div>

<script src="js/layout.js"></script>
<script src="js/app.js"></script>
</body>
</html>
