<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Settings — VitalNet</title>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600;700&family=IBM+Plex+Mono:wght@500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
<link rel="stylesheet" href="css/style.css">
</head>
<body data-page="settings.html" data-role="member" data-title="Settings" data-sub="Account, notifications and appearance">

<div class="grid grid-2">
  <form class="card card-lg" data-demo="Account settings saved.">
    <div class="card-head"><h3>Account</h3></div>
    <div class="form-group"><label>Full Name</label><input class="form-control" value="Yagavi S"></div>
    <div class="form-group"><label>Email</label><input type="email" class="form-control" value="yagavi@example.com"></div>
    <div class="form-group"><label>Phone</label><input class="form-control" value="+91 90000 00000"></div>
    <button class="btn btn-primary">Save</button>
  </form>

  <div class="card card-lg">
    <div class="card-head"><h3>Preferences</h3></div>
    <div class="list-row"><span>Email notifications</span><input type="checkbox" checked></div>
    <div class="list-row"><span>SMS medicine reminders</span><input type="checkbox" checked></div>
    <div class="list-row"><span>Emergency contact alerts</span><input type="checkbox" checked></div>
    <div class="list-row"><span>Dark mode</span><input type="checkbox" onclick="vnToast('Dark mode is coming in the next VitalNet release.')"></div>
  </div>
</div>

<div class="card card-lg" style="margin-top:1rem;border-color:var(--alert-soft);">
  <div class="card-head"><h3 style="color:var(--alert);">Danger Zone</h3></div>
  <div class="flex-between">
    <span class="text-muted" style="font-size:.85rem;">Permanently delete your VitalNet account and health records.</span>
    <button class="btn btn-alert btn-sm" onclick="vnToast('Account deletion requires confirmation from your registered email.')">Delete Account</button>
  </div>
</div>

<script src="js/layout.js"></script>
<script src="js/app.js"></script>
</body>
</html>
