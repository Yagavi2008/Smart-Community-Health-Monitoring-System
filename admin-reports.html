<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Reports Management — VitalNet</title>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600;700&family=IBM+Plex+Mono:wght@500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
<link rel="stylesheet" href="css/style.css">
</head>
<body data-page="admin-reports.html" data-role="admin" data-title="Reports Management" data-sub="Generate and export community health reports">

<div class="card card-lg" style="margin-bottom:1rem;">
  <div class="card-head"><h3>Generate Report</h3></div>
  <div class="form-row">
    <div class="form-group"><label>Report Type</label><select class="form-control"><option>Monthly Health Summary</option><option>Disease Distribution</option><option>Vaccination Coverage</option><option>Emergency Response Log</option></select></div>
    <div class="form-group"><label>Date Range</label><input type="month" class="form-control" value="2026-06"></div>
  </div>
  <button class="btn btn-primary" onclick="vnToast('Report generated and ready to download.')"><i class="fa-solid fa-file-export"></i> Generate</button>
</div>

<div class="card card-lg">
  <div class="card-head"><h3>Recent Reports</h3></div>
  <table class="table">
    <thead><tr><th>Report</th><th>Generated</th><th>Type</th><th></th></tr></thead>
    <tbody>
      <tr><td>June 2026 Health Summary</td><td>01 Jul 2026</td><td>Monthly</td><td><button class="btn btn-outline btn-sm" onclick="vnToast('Downloading report...')">Download</button></td></tr>
      <tr><td>Q2 2026 Vaccination Coverage</td><td>29 Jun 2026</td><td>Quarterly</td><td><button class="btn btn-outline btn-sm" onclick="vnToast('Downloading report...')">Download</button></td></tr>
      <tr><td>May 2026 Emergency Log</td><td>02 Jun 2026</td><td>Monthly</td><td><button class="btn btn-outline btn-sm" onclick="vnToast('Downloading report...')">Download</button></td></tr>
    </tbody>
  </table>
</div>

<script src="js/layout.js"></script>
<script src="js/app.js"></script>
</body>
</html>
