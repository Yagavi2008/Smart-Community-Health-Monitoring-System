<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Log In — VitalNet</title>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600;700&family=IBM+Plex+Mono:wght@500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<div class="auth-wrap">
  <div class="auth-visual">
    <div class="brand-mark" style="color:#fff;"><span class="pulse-dot"></span> VitalNet</div>
    <div>
      <h2 style="color:#fff;max-width:16ch;">Welcome back to your community's health hub.</h2>
      <svg class="ecg-strip" viewBox="0 0 400 60" style="margin:1.5rem 0;"><path class="ecg-live" d="M0 30 L60 30 L75 10 L90 50 L105 30 L160 30 L175 15 L190 45 L205 30 L400 30" stroke="white"/></svg>
      <p style="color:#DCEBFA;max-width:34ch;">Log in to check today's vitals, chat with your AI health assistant, or review upcoming appointments.</p>
    </div>
    <div style="color:#7FA6C8;font-size:.8rem;">SIH 2025 · Smart Community Health Monitoring System</div>
  </div>
  <div class="auth-form-col">
    <div class="auth-box">
      <h2>Log in to VitalNet</h2>
      <p class="text-muted" style="margin-bottom:1.5rem;">New here? <a href="register.html">Create an account</a></p>
      <form data-demo="Logged in successfully." data-redirect="dashboard.html">
        <div class="form-group"><label>Email</label><input type="email" class="form-control" placeholder="you@example.com" required></div>
        <div class="form-group"><label>Password</label><input type="password" class="form-control" placeholder="••••••••" required></div>
        <div class="form-group"><label>Log in as</label>
          <select class="form-control" id="loginRole">
            <option value="dashboard.html">Community Member</option>
            <option value="doctor-dashboard.html">Doctor</option>
            <option value="admin-dashboard.html">Health Admin</option>
          </select>
        </div>
        <button class="btn btn-primary btn-block">Log In</button>
      </form>
      <p class="text-muted" style="text-align:center;margin-top:1.2rem;font-size:.8rem;"><a href="index.html">← Back to home</a></p>
    </div>
  </div>
</div>
<script src="js/app.js"></script>
<script>
document.querySelector('form').addEventListener('submit', function(){
  var target = document.getElementById('loginRole').value;
  this.setAttribute('data-redirect', target);
});
</script>
</body>
</html>
