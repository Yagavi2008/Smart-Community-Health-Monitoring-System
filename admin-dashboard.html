<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Admin Dashboard — VitalNet</title>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600;700&family=IBM+Plex+Mono:wght@500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
<link rel="stylesheet" href="css/style.css">
</head>
<body data-page="admin-dashboard.html" data-role="admin" data-title="Community Health Overview" data-sub="System-wide status across all members">

<div class="grid grid-4" style="margin-bottom:1rem;">
  <div class="card stat-card"><div class="stat-icon" style="background:var(--primary-soft);color:var(--primary);"><i class="fa-solid fa-users"></i></div><div class="stat-label">Registered Members</div><div class="stat-value">3,482</div></div>
  <div class="card stat-card"><div class="stat-icon" style="background:var(--teal-soft);color:var(--teal);"><i class="fa-solid fa-user-doctor"></i></div><div class="stat-label">Active Doctors</div><div class="stat-value">46</div></div>
  <div class="card stat-card"><div class="stat-icon" style="background:var(--alert-soft);color:var(--alert);"><i class="fa-solid fa-triangle-exclamation"></i></div><div class="stat-label">Emergency Cases (24h)</div><div class="stat-value">7</div></div>
  <div class="card stat-card"><div class="stat-icon" style="background:var(--ok-soft);color:var(--ok);"><i class="fa-solid fa-syringe"></i></div><div class="stat-label">Vaccination Rate</div><div class="stat-value">88%</div></div>
</div>

<div class="grid" style="grid-template-columns:1.3fr 1fr;">
  <div class="card card-lg">
    <div class="card-head"><h3>Disease Distribution</h3></div>
    <div style="height:230px;"><canvas id="diseaseChart"></canvas></div>
  </div>
  <div class="card card-lg">
    <div class="card-head"><h3>Health Alerts</h3></div>
    <div class="list-row"><span>Divya M — BP 158/98</span><span class="badge badge-alert">Critical</span></div>
    <div class="list-row"><span>Zone 4 — Dengue cluster</span><span class="badge badge-warn">Watch</span></div>
    <div class="list-row"><span>Karthik R — Sugar rising</span><span class="badge badge-warn">Follow-up</span></div>
    <a href="admin-emergency.html" class="btn btn-outline btn-sm btn-block" style="margin-top:.6rem;">Open Emergency Monitoring</a>
  </div>
</div>

<div class="card card-lg" style="margin-top:1rem;">
  <div class="card-head"><h3>Age-wise Health Statistics</h3></div>
  <div style="height:220px;"><canvas id="ageChart"></canvas></div>
</div>

<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>
<script src="js/charts.js"></script>
<script src="js/layout.js"></script>
<script src="js/app.js"></script>
<script>
vnDoughnut(document.getElementById('diseaseChart'),
  ['Hypertension','Diabetes','Obesity','Respiratory','Other'],
  [32,24,18,14,12],
  [VN_COLORS.primary, VN_COLORS.teal, VN_COLORS.warn, VN_COLORS.alert, '#B7C7D6']);

vnBarChart(document.getElementById('ageChart'),
  ['0-18','19-35','36-50','51-65','65+'],
  [{label:'Members at health risk', data:[8,22,41,63,58], backgroundColor:VN_COLORS.primary}]);
</script>
</body>
</html>
